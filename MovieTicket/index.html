<!DOCTYPE html>

<html lang="es">
<head>
   
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Movie Ticket</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="reproductor-de-video.png" type="image/x-icon">
</head>
<body>
   
    <div class="ticket">
       
        <div class="top">
          
            <h2>Cinema</h2>
            <!-- Subtítulo de la película snpt-->
            <div class="movie-title">CS Film</div>
        </div>
        
       
        <div class="bottom">
            
            <div class="info">
                <div>DATE</div>
                <span>SEP 28</span>
            </div>
           
            <div class="info" style="text-align: center;">
                <div>TIME</div>
                <span>20:00</span>
            </div>
           
            <div class="info" style="text-align: right;">
                <div>SEAT</div>
                <span>A12</span>
            </div>
        </div>
    </div>
</body>
</html>
