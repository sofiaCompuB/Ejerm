<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Suscripcion</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="formularios-de-google.png" type="image/x-icon">

</head>
<body>
    <!-- Contenedor principal del formulario -->
    <div class="subscribe-card">
        <h2>Stay Tuned</h2> <!-- Titulo principal -->
        <p>Get the latest drops and exclusive playlists.</p>
        
        <!-- Campo de entrada de email -->
        <input type="email" placeholder="Enter your email" required>
        
        <!-- Boton de suscripcion -->
        <button type="submit">Subscribe</button>
    </div>
</body>
</html>
